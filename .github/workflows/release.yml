name: Build Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          source version.properties
          test "$GITHUB_REF_NAME" = "v$VERSION_NAME"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DETAILFLOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/detailflow-release.keystore"

      - name: Build signed APK
        env:
          DETAILFLOW_KEYSTORE: ${{ runner.temp }}/detailflow-release.keystore
        run: ./build.sh

      - name: Verify APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose DetailFlow-debug.apk
          sha256sum DetailFlow-debug.apk > DetailFlow-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DetailFlow-${{ github.ref_name }}
          path: |
            DetailFlow-debug.apk
            DetailFlow-debug.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          DetailFlow-debug.apk
          DetailFlow-debug.apk.sha256
          --title "DetailFlow $GITHUB_REF_NAME"
          --generate-notes
